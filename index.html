<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wirtualna Dyspozytornia Medyczna 999</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .screen-container { width: 100%; max-width: 420px; height: 100vh; max-height: 850px; background: #111827; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

    /* EKRAN HASŁA */
    #auth-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; }
    .shield-icon { width: 70px; height: 70px; background: #dc2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 24px; }
    .auth-input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #374151; background: #1f2937; color: white; font-size: 18px; text-align: center; margin: 20px 0; outline: none; }
    .auth-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #dc2626; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
    .error-msg { color: #f87171; font-size: 14px; display: none; margin-top: 10px; }

    /* EKRAN TELEFONU - ZWARTE ODSTĘPY MOBILNE */
    #phone-screen { flex: 1; display: none; flex-direction: column; justify-content: space-between; padding: 16px 20px; }
    .display-number { font-size: 56px; text-align: center; font-weight: 700; letter-spacing: 6px; min-height: 64px; color: #fff; }
    .call-status { font-size: 13px; text-align: center; color: #9ca3af; min-height: 20px; margin-bottom: 6px; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .key { background: #1f2937; border-radius: 50%; width: 64px; height: 64px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; user-select: none; border: 1px solid #374151; }
    .key:active { background: #374151; }
    .key-number { font-size: 24px; font-weight: 600; line-height: 1; }
    .key-sub { font-size: 9px; color: #9ca3af; letter-spacing: 2px; margin-top: 2px; }
    .actions { display: flex; justify-content: space-around; align-items: center; margin-bottom: 8px; }
    .call-btn { width: 68px; height: 68px; border-radius: 50%; background: #16a34a; display: flex; justify-content: center; align-items: center; cursor: pointer; border: none; font-size: 28px; box-shadow: 0 4px 14px rgba(22, 163, 74, 0.4); }
    .hangup-btn { width: 68px; height: 68px; border-radius: 50%; background: #dc2626; display: none; justify-content: center; align-items: center; cursor: pointer; border: none; box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4); }
    .del-btn { width: 50px; height: 50px; background: transparent; border: none; color: #9ca3af; font-size: 22px; cursor: pointer; }
  </style>
</head>
<body>

<div class="screen-container">
  <!-- Ekran Logowania -->
  <div id="auth-screen">
    <div class="shield-icon">🚨</div>
    <h2>Stacja Treningowa 999</h2>
    <p style="color: #9ca3af; font-size: 14px; margin-top: 8px;">Wprowadź kod dostępu instruktora</p>
    <input type="password" id="pass-input" class="auth-input" placeholder="Wpisz hasło stacji">
    <button class="auth-btn" onclick="checkAuth()">Odblokuj Stację</button>
    <div id="auth-error" class="error-msg">Nieprawidłowe hasło stacji</div>
  </div>

  <!-- Ekran Wybierania Numeru -->
  <div id="phone-screen">
    <div class="call-status" id="call-status">Wybierz numer alarmowy</div>
    <div class="display-number" id="phone-display"></div>

    <div class="keypad">
      <div class="key" onclick="pressKey('1')"><span class="key-number">1</span><span class="key-sub">&nbsp;</span></div>
      <div class="key" onclick="pressKey('2')"><span class="key-number">2</span><span class="key-sub">ABC</span></div>
      <div class="key" onclick="pressKey('3')"><span class="key-number">3</span><span class="key-sub">DEF</span></div>
      <div class="key" onclick="pressKey('4')"><span class="key-number">4</span><span class="key-sub">GHI</span></div>
      <div class="key" onclick="pressKey('5')"><span class="key-number">5</span><span class="key-sub">JKL</span></div>
      <div class="key" onclick="pressKey('6')"><span class="key-number">6</span><span class="key-sub">MNO</span></div>
      <div class="key" onclick="pressKey('7')"><span class="key-number">7</span><span class="key-sub">PQRS</span></div>
      <div class="key" onclick="pressKey('8')"><span class="key-number">8</span><span class="key-sub">TUV</span></div>
      <div class="key" onclick="pressKey('9')"><span class="key-number">9</span><span class="key-sub">WXYZ</span></div>
      <div class="key" onclick="pressKey('*')"><span class="key-number">*</span><span class="key-sub">&nbsp;</span></div>
      <div class="key" onclick="pressKey('0')"><span class="key-number">0</span><span class="key-sub">+</span></div>
      <div class="key" onclick="pressKey('#')"><span class="key-number">#</span><span class="key-sub">&nbsp;</span></div>
    </div>

    <div class="actions">
      <button class="del-btn" style="visibility: hidden;">&nbsp;</button>
      <button class="call-btn" id="call-btn" onclick="startCall()">📞</button>
      <button class="hangup-btn" id="hangup-btn" onclick="endCall()" title="Rozłącz">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="#ffffff">
          <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-1.02.49-1.96 1.13-2.8 1.89-.2.18-.46.29-.74.29-.3 0-.58-.12-.78-.32L.38 13.44a1.1 1.1 0 0 1 0-1.56C3.36 8.92 7.44 7 12 7s8.64 1.92 11.62 4.88c.43.43.43 1.13 0 1.56l-2.14 2.14c-.2.2-.48.32-.78.32-.28 0-.54-.11-.74-.29-.84-.76-1.78-1.4-2.8-1.89-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
        </svg>
      </button>
      <button class="del-btn" onclick="deleteDigit()">⌫</button>
    </div>
  </div>
</div>

<script src="config.js?v=211"></script>
<script src="app.js?v=211"></script>
</body>
</html>
